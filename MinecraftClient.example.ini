# Overlay for MCC's generated MinecraftClient.ini -- only the settings that differ from
# the defaults. Copy it to data-N/MinecraftClient.ini before the first run; MCC fills in
# every setting omitted here with its default and rewrites the file. (If a future MCC
# release rejects a partial file, start the container once to generate a full default
# and apply these keys onto it instead.)
#
# One copy per account, in that account's own data dir. Never commit a filled-in copy:
# it holds the account password and the Discord bot token in plain text.

[Main.General]
# Leave Password empty. AccountType/Method below use the device-code flow, which prints
# a microsoft.com/link code on first run and then lives off the session cache.
Account = { Login = "you@example.com", Password = "" }
Server = { Host = "cosmicreborn.net" }
AccountType = "microsoft"
Method = "mcc"                              # device code; the only method that survives 2FA

[Main.Advanced]
MinecraftVersion = "1.8.9"
SessionCache = "disk"                       # carries the login across restarts
ConsoleTitle = "mcc-N idle"
# MUST be true. CosmicReborn refuses all chat and commands until the character has
# moved, so with this off the /server alienplanet hop in join.txt can never fire.
TerrainAndMovements = true

# Aliases for /connect, used by the Discord stop/start commands (see the README section
# "Taking a bot offline"). MCC rejects any host with no dot in it that is not literally
# "localhost", and it re-applies that same test to an alias's own target -- so "limbo"
# has to point at the dotted network alias defined in docker-compose.yml, never at the
# bare service name. Giving the limbo entry an explicit Port also skips the SRV lookup
# MCC would otherwise attempt on a dotted name.
# Keys are matched case-sensitively against whatever you type after .connect.
[Main.Advanced.ServerList]
cosmic = { Host = "cosmicreborn.net" }
limbo = { Host = "limbo.internal", Port = 25565 }

[Console.General]
# The container has no pty, so ANSI escapes would land in the logs as literal garbage.
ConsoleColorMode = "disable"
Display_Icon_Banner = false
Display_Input = false

[Console.CommandSuggestion]
Enable = false

[ChatBot.AutoRelog]
Enabled = true
Delay = { min = 3.0, max = 3.0 }
Retries = -1
# "logging in too fast" is CosmicReborn's own throttle message and is not in MCC's
# default list; without it a rejected relog is treated as permanent.
Kick_Messages = [ "Connection has been lost", "Server is restarting", "Server is full", "Too Many people", "AFK", "idle", "inactivity", "timed out", "logging in too fast", ]

[ChatBot.DiscordBridge]
Enabled = true
Token = ""                                  # bot token -- fill in locally, never commit
ChannelId = 0
# MCC gates the bridge on Discord USER ids only; it has no role support, so every
# person who may drive the bot has to be listed here individually.
OwnersIds = [ ]
Relay_All_Messages = true
Message_Aggregation_Interval = 3.0          # batched, or Discord rate-limits the channel

[ChatBot.ScriptScheduler]
Enabled = true

# Every login lands in the network lobby, so the hop has to run on reconnects too,
# not just the first join -- hence Trigger_On_Login rather than Trigger_On_First_Login.
[[ChatBot.ScriptScheduler.TaskList]]
Task_Name = "Join alienplanet"
Trigger_On_First_Login = false
Trigger_On_Login = true
Trigger_On_Times = { Enable = false, Times = [ ] }
Trigger_On_Interval = { Enable = false, MinTime = 1.0, MaxTime = 10.0 }
Action = "script join.txt"
